name: Keep Render site os Backend Awake
on:
  schedule:
    - cron: '*/10 * * * *'  # S'exécute toutes les 10 minutes
  workflow_dispatch: {}     # Permet de lancer le ping manuellement depuis GitHub si besoin

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend health endpoint
        run: |
          # ⚠️ REMPLACEZ CETTE URL PAR L'URL RÉELLE DE VOTRE APP RENDER
          # Si vous n'avez pas de route "/actuator/health", mettez juste l'URL racine "/" ou "/ping"
          curl -fsS https://siteos-hhj6.onrender.com/api/projects || true
