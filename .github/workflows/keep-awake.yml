name: Keep Render SiteOs Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Render sites
        run: |
          echo "Pinging Backend..."
          curl -fsS https://siteos-hhj6.onrender.com/api/projects || true

          echo "Pinging Frontend..."
          curl -fsS https://construction-site-knj9.onrender.com || true
